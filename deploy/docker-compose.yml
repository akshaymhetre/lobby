# Lobby - self-hosted intranet.
#
# Run it:       ./deploy/setup.sh, then `cd deploy && docker compose up -d`.
#               setup.sh writes deploy/.env, including COMPOSE_PROFILES, which picks the services.
#
# Profiles:
#   (none)      Postgres only. This is the development workflow: the app runs on the host with
#               `pnpm dev`, so nothing here may bind port 4100 unless the `app` profile is on.
#   app         web + worker + caddy (the Lobby containers, served on LOBBY_URL)
#   demo-idp    Keycloak with a fictional company (Northwind Labs), plus Mailpit
#   demo-apps   Grafana + Expenses, both signing in through the demo IdP
#   demo-seed   one-shot: loads the Northwind Labs demo data into an empty database
#   mail        Mailpit only (catches outgoing email)
#
# Development (unchanged):  docker compose --profile demo-idp --profile demo-apps up -d
name: lobby

# Settings shared by every Lobby container. Values come from deploy/.env (see .env.example).
# Defaults keep `docker compose config` working when there is no .env (the development workflow);
# web refuses to start in production without a LOBBY_SECRET, so a missing .env fails loudly.
x-lobby-env: &lobby-env
  LOBBY_URL: ${LOBBY_URL:-http://localhost:4100}
  LOBBY_SECRET: ${LOBBY_SECRET:-}
  LOBBY_SETUP_TOKEN: ${LOBBY_SETUP_TOKEN:-}
  DATABASE_URL: postgres://lobby:${POSTGRES_PASSWORD:-lobby}@postgres:5432/lobby
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Lobby <lobby@localhost>}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Read only by the demo seed: Lobby reaches the demo Keycloak on the Docker network,
  # while browsers keep using the public issuer http://localhost:4180/realms/northwind.
  DEMO_OIDC_DISCOVERY_URL: ${DEMO_OIDC_DISCOVERY_URL:-http://keycloak:8080/realms/northwind}


services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lobby}
      POSTGRES_DB: lobby
    ports: ["127.0.0.1:${POSTGRES_PORT:-4132}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    profiles: [demo-idp]
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:4180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:4180:8080"]
    volumes: ["./keycloak/realm-northwind.json:/opt/keycloak/data/import/realm-northwind.json:ro"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  grafana:
    profiles: [demo-apps]
    image: grafana/grafana:12.2.0
    depends_on: { keycloak: { condition: service_healthy } }
    environment:
      GF_SERVER_ROOT_URL: http://localhost:4130
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Northwind SSO
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: grafana-demo-secret
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://localhost:4180/realms/northwind/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/northwind/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/northwind/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'lobby-admins') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://localhost:4180/realms/northwind/protocol/openid-connect/logout
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports: ["127.0.0.1:4130:3000"]

  expenses-app:
    profiles: [demo-apps]
    image: node:24-alpine
    command: ["node", "/app/server.mjs"]
    volumes: ["./demo/expenses/server.mjs:/app/server.mjs:ro"]

  expenses:
    profiles: [demo-apps]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    depends_on: { keycloak: { condition: service_healthy } }
    command:
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --provider-display-name=Northwind SSO
      - --client-id=expenses
      - --client-secret=expenses-demo-secret
      - --oidc-issuer-url=http://localhost:4180/realms/northwind
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:4180/realms/northwind/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/northwind/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/northwind/protocol/openid-connect/certs
      - --redirect-url=http://localhost:4140/oauth2/callback
      - --upstream=http://expenses-app:3000
      - --email-domain=*
      - --cookie-secret=bm9ydGh3aW5kLWRlbW8tY29va2llLXNlY3JldC0zMmI=
      - --cookie-name=_expenses_proxy
      - --cookie-secure=false
      - --skip-provider-button=true
      - --code-challenge-method=S256
      - --pass-user-headers=true
      - --scope=openid email profile
    ports: ["127.0.0.1:4140:4180"]

  mailpit:
    profiles: [mail, demo-idp]
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:4125:8025", "127.0.0.1:4126:1025"]

  web:
    profiles: [app]
    build: { context: .., dockerfile: Dockerfile, target: web }
    image: lobby/web:local
    restart: unless-stopped
    init: true
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      <<: *lobby-env
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes: [lobby-data:/data]
    stop_grace_period: 20s

  worker:
    profiles: [app]
    build: { context: .., dockerfile: Dockerfile, target: worker }
    image: lobby/worker:local
    restart: unless-stopped
    init: true
    depends_on: { postgres: { condition: service_healthy } }
    environment: *lobby-env
    volumes: [lobby-data:/data]
    stop_grace_period: 20s

  caddy:
    profiles: [app]
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: { web: { condition: service_healthy } }
    environment:
      LOBBY_SITE_ADDRESS: ${LOBBY_SITE_ADDRESS:-:80}
    ports:
      - "${LOBBY_BIND_ADDRESS:-127.0.0.1}:${LOBBY_HTTP_PORT:-4100}:80"
      - "${LOBBY_BIND_ADDRESS:-127.0.0.1}:${LOBBY_HTTPS_PORT:-4443}:443"
      - "${LOBBY_BIND_ADDRESS:-127.0.0.1}:${LOBBY_HTTPS_PORT:-4443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  seed-demo:
    profiles: [demo-seed]
    build: { context: .., dockerfile: Dockerfile, target: worker }
    image: lobby/worker:local
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment: *lobby-env
    command: ["node", "/opt/lobby/migrate/seed-demo.mjs"]

volumes:
  pgdata:
  lobby-data:
  caddy-data:
  caddy-config:
